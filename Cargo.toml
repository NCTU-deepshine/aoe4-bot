[package]
name = "aoe4-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = "1.0.226"
# `builder` is what the tournament feature's channels, threads and buttons are made
# of (docs/tournament.md §8). It was previously only enabled transitively by poise,
# so ask for it directly rather than depending on another crate's feature set.
# Deliberately not `collector`: §8.5 rejects collectors for persistent panels.
serenity = { version = "0.12.4", default-features = false, features = [
    "builder",
    "client",
    "gateway",
    "rustls_backend",
    "model",
] }
sqlx = { version ="0.8.6", features = ["runtime-tokio", "tls-native-tls", "sqlite", "chrono"]}
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.41"
poise = "0.6.1"
reqwest = { version = "0.13.1", features = ["json"] }
chrono = { version = "0.4.42", features = ["serde"] }
tokio-cron-scheduler = "0.15.1"
rand = "0.9.2"
# `env-filter` is not a default feature, and without it `fmt::init()` pins the level
# at INFO and ignores RUST_LOG entirely — see the filter built in `main`.
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
regex = "1.12.2"
# East Asian display width, for the bracket's column alignment (docs/tournament.md §8.6).
unicode-width = "0.2.2"
