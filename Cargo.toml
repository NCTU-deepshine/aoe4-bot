[package]
name = "aoe4-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = "1.0.226"
serenity = { version = "0.12.4", default-features = false, features = [
    "builder",
    "client",
    "gateway",
    "rustls_backend",
    "model",
] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "sqlite", "chrono"]}
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.41"
poise = "0.6.1"
reqwest = { version = "0.13.1", features = ["json", "cookies", "form"] }
chrono = { version = "0.4.42", features = ["serde"] }
tokio-cron-scheduler = "0.15.1"
rand = "0.10.2"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
regex = "1.12.2"
unicode-width = "0.2.2"

serde_json = "1.0"

[dev-dependencies]
wiremock = "0.6"
